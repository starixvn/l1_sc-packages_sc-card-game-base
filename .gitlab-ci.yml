stages:
    - test
    - post-test
    - publish
include:
    - project: "ci/common-ci"
      ref: master
      file: "sonarqube/sonarqube.js-unittest.gitlab-ci.yml"
    - project: "ci/common-ci"
      ref: master
      file: "npm/publish-npm.gitlab-ci.yml"

variables:
  PROJECT_NAME: sc-card-game-base

unit-test-js:
  stage: test
  image: registry.nexdev.net:5050/docker/node:18.1-buster-slim
  tags:
    - docker
  before_script:
    - npm set registry http://npm.lumigame.com
    - yarn install
    - npm run test
  script:
    - npm run test-coverage
  rules:
    - when: always
  allow_failure: true
  artifacts:
    when: always
    paths:
      - ./coverage
      - ./reports
    expire_in: 1 day
    reports:
        junit: coverage/*.xml
        cobertura: coverage/cobertura-coverage.xml